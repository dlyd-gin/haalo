[project]
name = "translator-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mlx-lm",
    "fastapi",
    "uvicorn[standard]",
    "huggingface_hub[cli]",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
