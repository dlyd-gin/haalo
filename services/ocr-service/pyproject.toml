[project]
name = "ocr-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mlx-vlm",
    "fastapi",
    "uvicorn[standard]",
    "pillow",
    "python-multipart",
    "huggingface_hub[cli]",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
